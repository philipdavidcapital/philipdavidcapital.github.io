name = "pdcm-careers"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Secrets are NOT set here. Set them with `wrangler secret put NAME`, which
# stores them encrypted with Cloudflare rather than in this repository:
#   RESEND_API_KEY
#   VIRUSTOTAL_API_KEY   (optional; without it the known-sample check is skipped)

[vars]
MAIL_TO = "jgarrison@philipdavidcapital.com"
MAIL_FROM = "Careers <careers@philipdavidcapital.com>"
ALLOWED_ORIGINS = "https://philipdavidcapital.com,https://www.philipdavidcapital.com"

# Per-address submission limit. Five a minute is generous for a person and
# hostile to a loop; see README. The endpoint runs without this binding and
# reports that it is absent rather than implying a limit it cannot enforce.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
